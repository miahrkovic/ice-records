<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b2a55">
<title>Ice Records – upravljač</title>
<style>
  :root{--i900:#0b2a55;--i700:#17509b;--i500:#3b86d6;--i300:#9cc7f2}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
    background:radial-gradient(circle at 25% 10%,#2a6ec0 0%,#0f3d7a 45%,#0b2a55 100%)}
  .app{height:100%;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom));gap:12px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:900;letter-spacing:.12em;font-size:18px}
  .brand span{color:var(--i300);font-weight:700;letter-spacing:.2em;font-size:12px;display:block}
  .st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);padding:7px 12px;border-radius:999px}
  .st i{width:10px;height:10px;border-radius:50%;background:#e0607a}
  .st.ok i{background:#3ddc97;box-shadow:0 0 0 4px rgba(61,220,151,.25)}
  .info{background:rgba(255,255,255,.1);border:1.5px solid rgba(156,199,242,.35);border-radius:18px;padding:14px 16px}
  .num{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--i300);font-weight:700}
  .num b{font-size:30px;color:#fff;letter-spacing:0;margin-right:4px}
  .title{font-size:20px;font-weight:800;margin-top:4px;line-height:1.2}
  .prog{height:5px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:10px;overflow:hidden}
  .prog div{height:100%;width:0;background:linear-gradient(90deg,var(--i500),#fff);transition:width .3s}
  .notes{flex:1;min-height:0;overflow:auto;background:rgba(255,255,255,.07);border-radius:18px;padding:14px 16px;font-size:17px;line-height:1.5;user-select:text;-webkit-overflow-scrolling:touch}
  .notes b{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--i300);margin-bottom:6px}
  .notes.hidden{display:none}
  .row{display:grid;gap:10px}
  .nav{grid-template-columns:1fr 2fr;height:clamp(90px,20vh,150px)}
  .small{grid-template-columns:repeat(4,1fr)}
  button{border:0;border-radius:18px;color:#fff;font-weight:800;font-size:18px;cursor:pointer;transition:transform .08s,background .15s;touch-action:manipulation}
  button:active{transform:scale(.95)}
  .prev{background:rgba(255,255,255,.14);font-size:30px;border:1.5px solid rgba(156,199,242,.4)}
  .next{background:linear-gradient(135deg,#3b86d6,#17509b);font-size:34px;box-shadow:0 10px 30px rgba(59,134,214,.45)}
  .sm{background:rgba(255,255,255,.12);padding:12px 4px;font-size:15px;border:1.5px solid rgba(156,199,242,.3)}
  .sm.on{background:var(--i500)}
  /* povezivanje */
  .join{position:fixed;inset:0;background:#0b2a55;display:none;flex-direction:column;justify-content:center;gap:14px;padding:26px;z-index:5}
  .join.show{display:flex}
  .join h1{font-size:26px}
  .join p{color:var(--i300);line-height:1.5}
  .join input{padding:14px;border-radius:12px;border:1.5px solid var(--i300);background:rgba(255,255,255,.1);color:#fff;font-size:17px;user-select:text}
  .join button{padding:14px;background:var(--i500);font-size:17px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">ICE<span>RECORDS · UPRAVLJAČ</span></div>
    <div class="st" id="st"><i></i><span id="stt">Povezujem…</span></div>
  </div>
  <div class="info">
    <div class="num"><b id="cur">–</b>/ <span id="tot">–</span></div>
    <div class="title" id="ttl">Čekam računalo…</div>
    <div class="prog"><div id="pr"></div></div>
  </div>
  <div class="notes" id="notes"><b>Bilješke govornika</b><span id="nt">Otvori prezentaciju na računalu da se prikažu bilješke.</span></div>
  <div class="row small">
    <button class="sm" id="first">⏮ Prvi</button>
    <button class="sm" id="last">Zadnji ⏭</button>
    <button class="sm" id="audio">♪ Glazba</button>
    <button class="sm on" id="tn">📝 Bilješke</button>
  </div>
  <div class="row nav">
    <button class="prev" id="prev">◀</button>
    <button class="next" id="next">Sljedeći ▶</button>
  </div>
</div>

<div class="join" id="join">
  <h1>Poveži se s prezentacijom</h1>
  <p>Na računalu otvori prezentaciju, pritisni gumb 📱 dolje i otvori taj link ovdje. Ili upiši kod ispod.</p>
  <input id="code" placeholder="Kod sobe (npr. k3m9x2a7pq)" autocapitalize="off" autocomplete="off">
  <button id="go">Poveži</button>
</div>

<script>
const NTFY='https://ntfy.sh/';
const qs=new URLSearchParams(location.search);
let room=(qs.get('room')||'').trim();
try{ if(room) localStorage.setItem('ice_remote_room',room); else room=localStorage.getItem('ice_remote_room')||''; }catch(e){}
const $=id=>document.getElementById(id);
const topic=s=>'icerec-'+room+'-'+s;
let lastState=0, es=null, seen=new Set();

function setStatus(ok,txt){ $('st').classList.toggle('ok',ok); $('stt').textContent=txt; }

function send(cmd){
  if(navigator.vibrate) navigator.vibrate(18);
  fetch(NTFY+topic('c'),{method:'POST',body:cmd}).then(r=>{ if(!r.ok) setStatus(false,'Greška slanja'); }).catch(()=>setStatus(false,'Nema interneta'));
}

function applyState(s){
  lastState=Date.now();
  setStatus(true,'Povezano');
  $('cur').textContent=s.i+1; $('tot').textContent=s.n;
  $('ttl').textContent=s.t||'';
  $('pr').style.width=((s.i+1)/s.n*100)+'%';
  $('nt').textContent=s.note||'(nema bilješke za ovaj slajd)';
  $('notes').scrollTop=0;
}

function connect(){
  if(!room){ $('join').classList.add('show'); return; }
  $('join').classList.remove('show');
  if(es) es.close();
  es=new EventSource(NTFY+topic('s')+'/sse?since=latest');
  es.onopen=()=>{ send('hello'); };
  es.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.event!=='message'||seen.has(m.id)) return; seen.add(m.id);
    try{ applyState(JSON.parse(m.message)); }catch(e){}
  };
  es.onerror=()=>{ setStatus(false,'Povezujem…'); };
}
setInterval(()=>{ if(room){ send('hello'); } },20000);
setInterval(()=>{ if(lastState && Date.now()-lastState>30000) setStatus(false,'Računalo ne odgovara'); },5000);

$('next').onclick=()=>send('next');
$('prev').onclick=()=>send('prev');
$('first').onclick=()=>send('first');
$('last').onclick=()=>send('last');
$('audio').onclick=()=>{ $('audio').classList.toggle('on'); send('audio'); };
$('tn').onclick=()=>{ $('tn').classList.toggle('on'); $('notes').classList.toggle('hidden'); };
$('go').onclick=()=>{
  let v=$('code').value.trim();
  const m=v.match(/room=([a-z0-9]+)/i); if(m) v=m[1];
  if(!v) return; room=v.toLowerCase();
  try{ localStorage.setItem('ice_remote_room',room); }catch(e){}
  connect();
};

// swipe po kartici sa slajdom
let sx=null;
$('notes').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
$('notes').addEventListener('touchend',e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>90) send(dx<0?'next':'prev');
});

// ekran ostaje upaljen
async function wake(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} }
wake(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ wake(); connect(); } });

connect();
</script>
</body>
</html>
